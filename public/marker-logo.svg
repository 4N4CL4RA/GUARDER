<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes holográficos -->
    <linearGradient id="holographicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#00e5ff;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#8e24aa;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#e91e63;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ff6ec7;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Gradiente do escudo interno -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtros para efeitos -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  
  <!-- Formato de marcador principal -->
  <path d="M200 50C130 50 75 105 75 175c0 70 125 225 125 225s125-155 125-225C325 105 270 50 200 50z" 
        fill="url(#holographicGrad)" 
        stroke="rgba(255,255,255,0.6)" 
        stroke-width="4" 
        filter="url(#shadow)"/>
  
  <!-- Círculo interno holográfico -->
  <circle cx="200" cy="175" r="85" 
          fill="rgba(255,255,255,0.15)" 
          stroke="rgba(255,255,255,0.4)" 
          stroke-width="2"/>
  
  <!-- Escudo de segurança -->
  <path d="M200 110c-25 0-50 12-50 12v50c0 35 50 65 50 65s50-30 50-65v-50S225 110 200 110z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255,255,255,0.8)" 
        stroke-width="2"
        filter="url(#glow)"/>
  
  <!-- Avião no centro (símbolo de viagem) -->
  <g transform="translate(200,175) scale(1.5)">
    <path d="M0,-15 L-8,-5 L-15,-8 L-12,-2 L-20,5 L-8,3 L0,15 L8,3 L20,5 L12,-2 L15,-8 L8,-5 Z" 
          fill="white" 
          stroke="rgba(30,58,138,0.5)" 
          stroke-width="1"
          filter="url(#glow)"/>
  </g>
  
  <!-- Reflexos holográficos -->
  <ellipse cx="180" cy="140" rx="15" ry="25" 
           fill="rgba(255,255,255,0.3)" 
           transform="rotate(-20 180 140)"/>
  <ellipse cx="220" cy="160" rx="8" ry="15" 
           fill="rgba(255,255,255,0.2)" 
           transform="rotate(15 220 160)"/>
</svg>